<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-labelledby="title desc">
  <title id="title">wasmquay: capability quay</title>
  <desc id="desc">An animated terminal-style banner showing WebAssembly component modules docking at an inspection quay with a scanning beam.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04121f"/>
      <stop offset="1" stop-color="#0a2740"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22e3c9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22e3c9" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#22e3c9" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="720" height="260" fill="url(#sky)"/>

  <!-- grid deck -->
  <g stroke="#123a55" stroke-width="1" opacity="0.55">
    <line x1="0" y1="210" x2="720" y2="210"/>
    <line x1="0" y1="232" x2="720" y2="232"/>
