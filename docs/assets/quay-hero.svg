<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-labelledby="title desc">
  <title id="title">wasmquay: capability quay</title>
  <desc id="desc">An animated terminal-style banner showing WebAssembly component modules docking at an inspection quay with a scanning beam.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04121f"/>
      <stop offset="1" stop-color="#0a2740"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22e3c9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22e3c9" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#22e3c9" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="720" height="260" fill="url(#sky)"/>

  <!-- grid deck -->
  <g stroke="#123a55" stroke-width="1" opacity="0.55">
    <line x1="0" y1="210" x2="720" y2="210"/>
    <line x1="0" y1="232" x2="720" y2="232"/>
    <line x1="120" y1="200" x2="120" y2="260"/>
    <line x1="300" y1="200" x2="300" y2="260"/>
    <line x1="480" y1="200" x2="480" y2="260"/>
    <line x1="620" y1="200" x2="620" y2="260"/>
  </g>

  <!-- scanning beam sweeping across the quay -->
  <rect x="-160" y="0" width="160" height="210" fill="url(#beam)">
    <animate attributeName="x" values="-160;720" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- docked component modules (each a .wasm crate) -->
  <g font-family="'Consolas','SFMono-Regular',monospace" font-size="11">
    <g filter="url(#glow)">
      <rect x="70" y="120" width="110" height="80" rx="6" fill="#0e2f49" stroke="#22e3c9" stroke-width="1.5"/>
      <text x="125" y="150" fill="#8ff5e6" text-anchor="middle">clock-svc</text>
      <text x="125" y="170" fill="#4fb9c9" text-anchor="middle">clock · fs</text>
      <rect x="82" y="180" width="86" height="6" rx="3" fill="#123a55"/>
      <rect x="82" y="180" width="30" height="6" rx="3" fill="#22e3c9">
        <animate attributeName="width" values="10;86;10" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g filter="url(#glow)">
      <rect x="250" y="100" width="110" height="100" rx="6" fill="#0e2f49" stroke="#ff7a59" stroke-width="1.5"/>
      <text x="305" y="132" fill="#ffc4b3" text-anchor="middle">net-svc</text>
      <text x="305" y="152" fill="#ff9d86" text-anchor="middle">network!</text>
      <circle cx="305" cy="176" r="7" fill="none" stroke="#ff7a59" stroke-width="1.5">
        <animate attributeName="r" values="5;10;5" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g filter="url(#glow)">
