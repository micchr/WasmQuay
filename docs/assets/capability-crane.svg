<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320" role="img" aria-labelledby="ct cd">
  <title id="ct">capability crane</title>
  <desc id="cd">An animated crane hoisting capability containers (fs, env, clock, network) and sorting them into allow and deny bins according to a policy.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061726"/>
      <stop offset="1" stop-color="#0b2036"/>
    </linearGradient>
    <filter id="g2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="520" height="320" fill="url(#bg2)"/>

  <!-- crane mast + jib -->
  <g stroke="#2f6f8a" stroke-width="4" fill="none">
    <line x1="70" y1="40" x2="70" y2="270"/>
    <line x1="70" y1="40" x2="420" y2="40"/>
    <line x1="70" y1="70" x2="400" y2="40"/>
    <line x1="70" y1="270" x2="120" y2="270"/>
  </g>

  <!-- trolley + cable + hook: travels along the jib -->
  <g>
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 250 0; 250 0; 0 0; 0 0" keyTimes="0;0.3;0.55;0.85;1" dur="7s" repeatCount="indefinite"/>
      <rect x="120" y="34" width="26" height="12" rx="2" fill="#3f8fb0"/>
      <line x1="133" y1="46" x2="133" y2="120" stroke="#5fb6d6" stroke-width="2">
        <animate attributeName="y2" values="120;190;190;120;120" keyTimes="0;0.3;0.55;0.85;1" dur="7s" repeatCount="indefinite"/>
      </line>
      <!-- hoisted capability container -->
      <g filter="url(#g2)">
        <animateTransform attributeName="transform" type="translate"
          values="0 0;0 70;0 70;0 0;0 0" keyTimes="0;0.3;0.55;0.85;1" dur="7s" repeatCount="indefinite"/>
        <rect x="112" y="120" width="42" height="30" rx="4" fill="#0f3350" stroke="#22e3c9" stroke-width="1.5"/>
        <text x="133" y="140" font-family="monospace" font-size="11" fill="#8ff5e6" text-anchor="middle">net</text>
      </g>
    </g>
  </g>

  <!-- ALLOW bin (green) -->
  <g filter="url(#g2)">
    <rect x="150" y="230" width="150" height="70" rx="6" fill="#0c2e22" stroke="#3ddc84" stroke-width="1.5"/>
    <text x="225" y="222" font-family="monospace" font-size="12" fill="#6ff0aa" text-anchor="middle">allow</text>
    <g font-family="monospace" font-size="11" fill="#3ddc84">
      <text x="168" y="256">clock ✓</text>
      <text x="168" y="276">stdio ✓</text>
      <text x="168" y="296">fs:/tmp ✓</text>
