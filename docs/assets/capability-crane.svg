<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320" role="img" aria-labelledby="ct cd">
  <title id="ct">capability crane</title>
  <desc id="cd">An animated crane hoisting capability containers (fs, env, clock, network) and sorting them into allow and deny bins according to a policy.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061726"/>
      <stop offset="1" stop-color="#0b2036"/>
    </linearGradient>
    <filter id="g2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="520" height="320" fill="url(#bg2)"/>

  <!-- crane mast + jib -->
  <g stroke="#2f6f8a" stroke-width="4" fill="none">
    <line x1="70" y1="40" x2="70" y2="270"/>
    <line x1="70" y1="40" x2="420" y2="40"/>
    <line x1="70" y1="70" x2="400" y2="40"/>
    <line x1="70" y1="270" x2="120" y2="270"/>
  </g>

  <!-- trolley + cable + hook: travels along the jib -->
  <g>
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 250 0; 250 0; 0 0; 0 0" keyTimes="0;0.3;0.55;0.85;1" dur="7s" repeatCount="indefinite"/>
