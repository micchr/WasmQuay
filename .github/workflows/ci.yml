name: ci

on:
  push:
    branches: [main]
  pull_request:

# The whole toolkit is offline/stdlib-only, so CI needs no registry access
# beyond installing the toolchains themselves.
jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
