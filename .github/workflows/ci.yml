name: ci

on:
  push:
    branches: [main]
  pull_request:

# The whole toolkit is offline/stdlib-only, so CI needs no registry access
# beyond installing the toolchains themselves.
jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --release --verbose
      - name: Test
        run: cargo test --verbose
      - name: Regenerate fixtures and inspect
        shell: bash
        run: |
          ./target/release/wasmquay gen-fixtures fixtures
          ./target/release/wasmquay inspect fixtures/net-service.wasm --pretty

  typescript:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No third-party runtime deps; only the TypeScript compiler is needed.
      - name: Install devDependencies
        run: cd explorer && npm install --no-audit --no-fund
      - name: Type-check
        run: cd explorer && npm run typecheck
      - name: Build
        run: cd explorer && npm run build
      - name: Test
        run: cd explorer && npm test

  integration:
    name: cross-language integration
    runs-on: ubuntu-latest
    needs: [rust, typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build both sides
        run: |
          cargo build --release
          cd explorer && npm install --no-audit --no-fund && npm run build
      - name: Rust report -> TS explorer
        run: |
          ./target/release/wasmquay gen-fixtures fixtures
          ./target/release/wasmquay inspect fixtures/net-service.wasm --json > net.json
          ./target/release/wasmquay policy fixtures/net-service.wasm examples/sandbox-strict.pol --json > pol.json || true
          node explorer/dist/cli.js surface net.json pol.json || true
