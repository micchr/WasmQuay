[workspace]
resolver = "2"
members = [
    "crates/wasmquay-core",
    "crates/wasmquay-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
repository = "https://github.com/micchr/wasmquay"
authors = ["wasmquay contributors"]
description = "Offline WebAssembly component inspection and capability-policy toolkit"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

