[package]
name = "wasmquay-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Command-line front end for the wasmquay WASM inspection toolkit"

[[bin]]
name = "wasmquay"
path = "src/main.rs"

# The CLI depends only on the core crate — still zero third-party deps, so the
# whole workspace compiles offline.
[dependencies]
wasmquay-core = { path = "../wasmquay-core" }
